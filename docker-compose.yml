services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: monitor
      POSTGRES_DB: monitor
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor"]
      interval: 5s
      retries: 10

  monitor:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./watchlist.yaml:/srv/watchlist.yaml:ro
    restart: unless-stopped

  web:
    build: .
    command: ["python", "-m", "app.main", "web"]
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./watchlist.yaml:/srv/watchlist.yaml:ro
    restart: unless-stopped

  # Backup diário do Postgres em ./backups, guardando os últimos 14 dias
  backup:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: monitor
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/monitor-$$(date +%Y-%m-%d).sql.gz
          pg_dump -h db -U monitor monitor | gzip > "$$f" && echo "backup ok: $$f"
          find /backups -name 'monitor-*.sql.gz' -mtime +14 -delete
          sleep 86400
        done
    restart: unless-stopped

  # WhatsApp (Evolution API). Remova se for usar só e-mail no começo.
  evolution:
    image: atendai/evolution-api:latest
    environment:
      AUTHENTICATION_API_KEY: ${EVOLUTION_APIKEY}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://monitor:monitor@db:5432/evolution?schema=public
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - evolution_instances:/evolution/instances
    restart: unless-stopped

volumes:
  pgdata:
  evolution_instances:
