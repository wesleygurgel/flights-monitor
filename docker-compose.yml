services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: monitor
      POSTGRES_DB: monitor
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro  # cria o banco da Evolution
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor"]
      interval: 5s
      retries: 10

  monitor:
    build: .
    env_file: .env
    environment:
      BROWSER_PROFILE: /browser/monitor  # cookies do Google para o calendário de preços
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./watchlist.yaml:/srv/watchlist.yaml:ro
      - browser_monitor:/browser
    restart: unless-stopped

  web:
    build: .
    command: ["python", "-m", "app.main", "web"]
    env_file: .env
    environment:
      BROWSER_PROFILE: /browser/web  # "Buscar agora" abre o próprio navegador
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./watchlist.yaml:/srv/watchlist.yaml:ro
      - browser_web:/browser
    restart: unless-stopped

  # Backup diário do Postgres em ./backups, guardando os últimos 14 dias
  backup:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: monitor
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # espera as migrações criarem as tabelas (senão o primeiro arquivo sai vazio)
        until psql -h db -U monitor -d monitor -tAc "select 1 from alembic_version" >/dev/null 2>&1; do sleep 10; done
        while true; do
          f=/backups/monitor-$$(date +%Y-%m-%d).sql.gz
          pg_dump -h db -U monitor monitor | gzip > "$$f" && echo "backup ok: $$f"
          find /backups -name 'monitor-*.sql.gz' -mtime +14 -delete
          sleep 86400
        done
    restart: unless-stopped

  # WhatsApp (Evolution API). Remova se for usar só e-mail no começo.
  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    environment:
      AUTHENTICATION_API_KEY: ${EVOLUTION_APIKEY}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://monitor:monitor@db:5432/evolution?schema=public
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
    ports:
      - "127.0.0.1:8080:8080"  # só nesta máquina; o monitor fala com ela pela rede interna (evolution:8080)
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - evolution_instances:/evolution/instances
    restart: unless-stopped

volumes:
  pgdata:
  evolution_instances:
  browser_monitor:
  browser_web:
