# drop_pct: alerta se preço cair >= X% abaixo da mediana dos últimos 30 dias.
# min_samples: nº de buscas finas antes de a regra relativa entrar (fase 2). 20 ≈ 1 semana com 3 buscas/dia.
# candidates: quantas datas mais baratas da varredura grossa viram busca fina.

